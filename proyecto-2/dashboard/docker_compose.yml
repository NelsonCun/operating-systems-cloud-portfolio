version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ../go-daemon/db:/var/lib/grafana
    depends_on:
      - sqlite-db

  sqlite-db:
    image: nouchka/sqlite3
    container_name: sqlite-db
    volumes:
      - ../go-daemon/db:/data
