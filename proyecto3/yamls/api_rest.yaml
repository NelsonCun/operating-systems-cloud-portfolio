apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      containers:
        - name: api-rust
          image: honied-maryjo-rejectedly.ngrok-free.dev/api_rust:latest
          env:
            - name: GRPC_SERVER_URL
              value: "http://server-go:5001"
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust
spec:
  selector:
    app: api-rust
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-rust-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-rust
                port:
                  number: 8080
