apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-rabbit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consumer-rabbit
  template:
    metadata:
      labels:
        app: consumer-rabbit
    spec:
      containers:
        - name: consumer-rabbit
          image: registry.example.com/so1/consumer-rabbit:2.0
          env:
            # URL de RabbitMQ, apuntando al Service de RabbitMQ en Kubernetes
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
            # URL de Redis/Valkey, apuntando al Service de Valkey
            - name: VALKEY_SERVICE_URL
              value: "valkey:6379"
          imagePullPolicy: IfNotPresent
          # No necesitas exponer puertos porque este pod solo consume mensajes
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-rabbit
spec:
  selector:
    app: consumer-rabbit
  ports:
    - protocol: TCP
      port: 8081  # opcional, solo si otros pods necesitan conectarse
      targetPort: 8081
  type: ClusterIP
