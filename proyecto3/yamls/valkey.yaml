apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: 2
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: redis:7.0-alpine  # Imagen ligera de Redis
          ports:
            - containerPort: 6379
          # Se pueden agregar parámetros opcionales de Redis si quieres persistencia
          args: ["--save", "900", "1", "--appendonly", "yes"]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app: valkey
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
