apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-writer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rabbit-writer
  template:
    metadata:
      labels:
        app: rabbit-writer
    spec:
      containers:
        - name: rabbit-writer
          image: registry.example.com/so1/rabbit-writer:1.0   # Cambia al tag correcto
          ports:
            - containerPort: 6002
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: rabbit-writer
spec:
  selector:
    app: rabbit-writer
  ports:
    - protocol: TCP
      port: 6002
      targetPort: 6002
  type: ClusterIP
